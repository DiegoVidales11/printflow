# Producción: HPA de 3 a 8 réplicas (valores del base) y su propio dominio.
# Con varios nodos y Longhorn instalado, cambia storageClassName a longhorn (parche comentado abajo).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: printflow-prod
resources:
  - ../../base
images:
  - name: ghcr.io/diegovidales11/printflow-api
    newTag: latest
  - name: ghcr.io/diegovidales11/printflow-web
    newTag: latest
patches:
  - target: { kind: Ingress, name: printflow }
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: printflow.192.168.100.62.nip.io
      - op: replace
        path: /spec/tls/0/hosts/0
        value: printflow.192.168.100.62.nip.io
  # - target: { kind: StatefulSet }
  #   patch: |-
  #     - op: replace
  #       path: /spec/volumeClaimTemplates/0/spec/storageClassName
  #       value: longhorn
