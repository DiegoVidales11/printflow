# Producción de laboratorio (clúster "prod": 1 control plane + 2 workers).
# HPA de 2 a 6 réplicas al 60 % (valores del base), web con 2 réplicas, réplicas repartidas entre workers.
# Dominio distinto al de desarrollo; apunta a la IP de un worker (ServiceLB publica el Ingress en los nodos).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: printflow-prod
resources:
  - ../../base
images:
  - name: ghcr.io/diegovidales11/printflow-api
    newTag: latest
  - name: ghcr.io/diegovidales11/printflow-web
    newTag: latest
patches:
  - target: { kind: Ingress, name: printflow }
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: printflow.192.168.100.71.nip.io
      - op: replace
        path: /spec/tls/0/hosts/0
        value: printflow.192.168.100.71.nip.io
