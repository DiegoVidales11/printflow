# Mínimo privilegio: se niega todo y solo se abren los caminos del diagrama de arquitectura.
# Calico es el que aplica estas reglas.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels: { k8s-app: kube-dns }
      ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
---
# ---------------------------------------------------------------- web
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: web-ingress
spec:
  podSelector:
    matchLabels: { app: web }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: ingress-nginx }
      ports:
        - port: 3000
---
# ---------------------------------------------------------------- api
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-ingress
spec:
  podSelector:
    matchLabels: { app: api }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: ingress-nginx }
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: monitoring }
        - podSelector:
            matchLabels: { app: cron }
      ports:
        - port: 3000
---
# api y worker pueden hablar con PgBouncer y MongoDB
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-egress
spec:
  podSelector:
    matchExpressions:
      - { key: app, operator: In, values: [api, outbox-worker] }
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels: { app: pgbouncer }
      ports:
        - port: 6432
    - to:
        - podSelector:
            matchLabels: { app: mongo }
      ports:
        - port: 27017
---
# El CronJob solo puede llamar a la API
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cron-egress
spec:
  podSelector:
    matchLabels: { app: cron }
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels: { app: api }
      ports:
        - port: 3000
---
# ---------------------------------------------------------------- pgbouncer
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pgbouncer
spec:
  podSelector:
    matchLabels: { app: pgbouncer }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { tier: backend }
        - podSelector:
            matchLabels: { app: db-job }
      ports:
        - port: 6432
  egress:
    - to:
        - podSelector:
            matchLabels: { app: postgres }
      ports:
        - port: 5432
---
# ---------------------------------------------------------------- postgres
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-ingress
spec:
  podSelector:
    matchLabels: { app: postgres }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app: pgbouncer }
        - podSelector:
            matchLabels: { app: db-job } # migraciones
      ports:
        - port: 5432
---
# ---------------------------------------------------------------- mongo
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mongo-ingress
spec:
  podSelector:
    matchLabels: { app: mongo }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app: api }
        - podSelector:
            matchLabels: { app: outbox-worker }
      ports:
        - port: 27017
---
# ---------------------------------------------------------------- jobs de BD
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: db-job-egress
spec:
  podSelector:
    matchLabels: { app: db-job }
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels: { app: postgres }
      ports:
        - port: 5432
    - to:
        - podSelector:
            matchLabels: { app: pgbouncer }
      ports:
        - port: 6432
