# Entrada única por HTTPS: /api → API (sin el prefijo), / → web.
# El host se reemplaza en cada overlay (dev / prod).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: printflow
  annotations:
    cert-manager.io/cluster-issuer: printflow-ca
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  tls:
    - hosts: [printflow.example.nip.io]
      secretName: printflow-tls
  rules:
    - host: printflow.example.nip.io
      http:
        paths:
          - path: /api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service: { name: api, port: { number: 80 } }
          - path: /()(.*)
            pathType: ImplementationSpecific
            backend:
              service: { name: web, port: { number: 80 } }
