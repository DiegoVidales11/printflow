# Carga los datos ficticios (120 pedidos, 34 usuarios, 25 bobinas...). Ejecutar DESPUÉS de db-migrate:
#   kubectl -n printflow-dev apply -f k8s/jobs/db-seed.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: db-seed
spec:
  backoffLimit: 2
  template:
    metadata:
      labels: { app: db-job }
    spec:
      restartPolicy: OnFailure
      containers:
        - name: seed
          image: ghcr.io/diegovidales11/printflow-api:latest
          command: ["node", "dist/seed.js"]
          envFrom:
            - secretRef: { name: db-secrets }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 384Mi }
