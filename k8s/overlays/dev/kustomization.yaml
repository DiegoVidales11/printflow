# Desarrollo (clúster "dev", 1 nodo): una réplica por capa y escalado MANUAL (sin HPA),
# como pide la práctica. Dominio propio de desarrollo.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: printflow-dev
resources:
  - ../../base
images:
  - name: ghcr.io/diegovidales11/printflow-api
    newTag: latest
  - name: ghcr.io/diegovidales11/printflow-web
    newTag: latest
patches:
  # Sin HPA en desarrollo: el escalado se hace a mano (kubectl scale) para experimentar
  - patch: |-
      $patch: delete
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: api
  - target: { kind: Deployment, name: api }
    patch: |-
      - op: add
        path: /spec/replicas
        value: 1
  - target: { kind: Deployment, name: web }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target: { kind: Ingress, name: printflow }
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: dev.192.168.100.62.nip.io
      - op: replace
        path: /spec/tls/0/hosts/0
        value: dev.192.168.100.62.nip.io
