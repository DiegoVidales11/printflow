# Respaldos programados de ambos motores (requisito: respaldo consistente, retención y destino separado).
# - PostgreSQL: pg_dump en formato custom (consistente: usa una transacción de solo lectura).
# - MongoDB: mongodump comprimido de la base "bitacora".
# - Destino: un PVC propio ("backups"), distinto de los volúmenes de las bases.
# - Retención: 7 días. Integridad: archivo .sha256 por respaldo.
# RPO objetivo: 24 h (respaldo diario a las 02:00). Para probar: kubectl create job --from=cronjob/...
#   kubectl -n printflow-prod apply -f k8s/backups/backups.yaml
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backups
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup-postgres
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels: { app: backup }
        spec:
          restartPolicy: OnFailure
          containers:
            - name: pg-dump
              image: postgres:16-alpine
              env:
                - name: PGPASSWORD
                  valueFrom: { secretKeyRef: { name: db-secrets, key: POSTGRES_PASSWORD } }
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -e
                  mkdir -p /backups/pg
                  F=/backups/pg/printflow-$(date +%Y%m%d-%H%M%S).dump
                  INICIO=$(date +%s)
                  pg_dump -h postgres-0.postgres -U printflow -d printflow -Fc -f "$F"
                  sha256sum "$F" > "$F.sha256"
                  find /backups/pg -name '*.dump*' -mtime +7 -delete
                  echo "Respaldo PostgreSQL OK: $F ($(du -h "$F" | cut -f1)) en $(( $(date +%s) - INICIO )) s"
                  ls -lh /backups/pg
              volumeMounts:
                - { name: backups, mountPath: /backups }
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits: { memory: 256Mi }
          volumes:
            - name: backups
              persistentVolumeClaim: { claimName: backups }
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup-mongo
spec:
  schedule: "15 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels: { app: backup }
        spec:
          restartPolicy: OnFailure
          containers:
            - name: mongodump
              image: mongo:7
              env:
                - name: MONGO_URL
                  valueFrom: { secretKeyRef: { name: db-secrets, key: MONGO_URL } }
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -e
                  mkdir -p /backups/mongo
                  F=/backups/mongo/bitacora-$(date +%Y%m%d-%H%M%S).archive.gz
                  INICIO=$(date +%s)
                  mongodump --uri="$MONGO_URL" --archive="$F" --gzip --quiet
                  sha256sum "$F" > "$F.sha256"
                  find /backups/mongo -name '*.archive.gz*' -mtime +7 -delete
                  echo "Respaldo MongoDB OK: $F ($(du -h "$F" | cut -f1)) en $(( $(date +%s) - INICIO )) s"
                  ls -lh /backups/mongo
              volumeMounts:
                - { name: backups, mountPath: /backups }
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits: { memory: 512Mi }
          volumes:
            - name: backups
              persistentVolumeClaim: { claimName: backups }
---
# Red: los respaldos son el único componente extra que puede hablar directo con las bases.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backup-egress
spec:
  podSelector:
    matchLabels: { app: backup }
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels: { app: postgres }
      ports:
        - port: 5432
    - to:
        - podSelector:
            matchLabels: { app: mongo }
      ports:
        - port: 27017
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-desde-backup
spec:
  podSelector:
    matchLabels: { app: postgres }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app: backup }
      ports:
        - port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mongo-desde-backup
spec:
  podSelector:
    matchLabels: { app: mongo }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app: backup }
      ports:
        - port: 27017
