# CI/CD de PrintFlow
# - Pull request o push: pruebas y compilación.
# - Push a main: construye las imágenes, las sube a GHCR y despliega en printflow-dev.
# - Tag v* (ej. v1.0.0): lo mismo pero despliega en printflow-prod (con aprobación del environment "prod").
name: ci-cd

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: API - instalar, compilar y probar
        working-directory: apps/api
        run: |
          npm ci
          npx prisma generate
          npm run build
          npm test
      - name: Web - instalar y compilar
        working-directory: apps/web
        run: |
          npm ci
          npm run build

  build:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v4
      - name: Nombre del dueño en minúsculas (GHCR lo exige)
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: apps/${{ matrix.app }}
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/printflow-${{ matrix.app }}:${{ github.sha }}
            ghcr.io/${{ env.OWNER }}/printflow-${{ matrix.app }}:latest

  deploy:
    needs: build
    # Runner instalado en la VM de k3s (el clúster no es accesible desde Internet)
    runs-on: self-hosted
    environment: ${{ startsWith(github.ref, 'refs/tags/') && 'prod' || 'dev' }}
    steps:
      - uses: actions/checkout@v4
      - name: Desplegar con Kustomize
        run: |
          AMBIENTE=${{ startsWith(github.ref, 'refs/tags/') && 'prod' || 'dev' }}
          NS=printflow-$AMBIENTE
          OWNER=${GITHUB_REPOSITORY_OWNER,,}
          TAG=${{ github.sha }}
          kubectl apply -k k8s/overlays/$AMBIENTE
          kubectl -n $NS set image deployment/api api=ghcr.io/$OWNER/printflow-api:$TAG
          kubectl -n $NS set image deployment/outbox-worker worker=ghcr.io/$OWNER/printflow-api:$TAG
          kubectl -n $NS set image deployment/web web=ghcr.io/$OWNER/printflow-web:$TAG
          kubectl -n $NS rollout status deployment/api --timeout=300s
          kubectl -n $NS rollout status deployment/web --timeout=300s
