# API NestJS sin estado: en producción el número de réplicas lo controla el HPA (2 a 6).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels: { app: api }
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api, tier: backend }
    spec:
      # Reparte las réplicas entre workers (en un clúster de un nodo no tiene efecto)
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: api }
      containers:
        - name: api
          image: ghcr.io/diegovidales11/printflow-api:latest
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - secretRef: { name: db-secrets }
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests: { cpu: 100m, memory: 160Mi }
            limits: { cpu: 500m, memory: 384Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: api
  labels: { app: api }
spec:
  selector: { app: api }
  ports:
    - name: http
      port: 80
      targetPort: http
---
# Worker del patrón outbox: misma imagen, otro proceso
apiVersion: apps/v1
kind: Deployment
metadata:
  name: outbox-worker
  labels: { app: outbox-worker }
spec:
  replicas: 1
  selector:
    matchLabels: { app: outbox-worker }
  template:
    metadata:
      labels: { app: outbox-worker, tier: backend }
    spec:
      containers:
        - name: worker
          image: ghcr.io/diegovidales11/printflow-api:latest
          command: ["node", "dist/worker.js"]
          envFrom:
            - secretRef: { name: db-secrets }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 300m, memory: 256Mi }
